<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Bio Tiếp Thị Liên Kết</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome cho icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fbbf24 0%, #f97316 28%, #f43f5e 65%, #7c3aed 100%);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 40px rgba(76, 29, 149, 0.22);
        }
        .link-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px -5px rgba(15, 23, 42, 0.25);
        }
        .category-btn {
            border: 1px solid transparent;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.08);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.35);
            border-radius: 3px;
        }
    </style>
</head>
<body class="text-slate-800 flex justify-center items-center p-4">

    <div class="w-full max-w-md mx-auto glass-panel rounded-3xl shadow-2xl overflow-hidden p-6 text-white relative">

        <!-- Nút chỉnh sửa nhanh / Chia sẻ -->
        <div class="absolute top-4 right-4 flex gap-2">
            <button onclick="openConfigModal()" class="w-9 h-9 rounded-full bg-white/20 hover:bg-white/40 flex items-center justify-center transition" title="Tùy chỉnh thông tin">
                <i class="fa-solid fa-gear text-sm"></i>
            </button>
            <button onclick="shareLink()" class="w-9 h-9 rounded-full bg-white/20 hover:bg-white/40 flex items-center justify-center transition" title="Chia sẻ trang">
                <i class="fa-solid fa-share-nodes text-sm"></i>
            </button>
        </div>

        <div class="flex flex-col items-center text-center mt-4 mb-6">
            <div class="relative mb-3">
                <img id="profile-avatar" src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=500&q=80" alt="Avatar" class="w-24 h-24 rounded-full object-cover border-4 border-white/40 shadow-lg">
                <span class="absolute bottom-0 right-0 bg-emerald-500 w-6 h-6 rounded-full border-2 border-white flex items-center justify-center text-xs" title="Đã xác thực">
                    <i class="fa-solid fa-check text-white"></i>
                </span>
            </div>
            <h1 id="profile-name" class="text-xl font-bold tracking-tight text-white drop-shadow">Gia dụng thông minh 🏠</h1>
            <p id="profile-bio" class="text-xs text-white/90 mt-1 max-w-xs leading-relaxed">
                Mẹo nhà bếp, đồ gia dụng, tiện ích & deal hot mỗi ngày ✨<br>Shop xu hướng, tiết kiệm, bền đẹp & tiện dụng:<br>👇 Chạm vào link yêu thích của bạn
            </p>

            <!-- Social Icons -->
            <div class="flex gap-4 mt-4 text-lg">
                <a href="https://www.tiktok.com" target="_blank" rel="noopener" class="w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition"><i class="fa-brands fa-tiktok"></i></a>
                <a href="https://www.instagram.com" target="_blank" rel="noopener" class="w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.youtube.com" target="_blank" rel="noopener" class="w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://www.facebook.com" target="_blank" rel="noopener" class="w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition"><i class="fa-brands fa-facebook"></i></a>
            </div>
        </div>

        <div class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none" id="category-filters">
            <button data-category="all" onclick="filterLinks('all', event)" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-indigo-700 shadow transition whitespace-nowrap active">Tất cả</button>
            <button data-category="cosmetics" onclick="filterLinks('cosmetics', event)" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white/20 hover:bg-white/30 text-white transition whitespace-nowrap">💄 Mỹ phẩm</button>
            <button data-category="tech" onclick="filterLinks('tech', event)" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white/20 hover:bg-white/30 text-white transition whitespace-nowrap">💻 Công nghệ</button>
            <button data-category="home" onclick="filterLinks('home', event)" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white/20 hover:bg-white/30 text-white transition whitespace-nowrap">🏠 Gia dụng</button>
            <button data-category="fashion" onclick="filterLinks('fashion', event)" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white/20 hover:bg-white/30 text-white transition whitespace-nowrap">👗 Thời trang</button>
        </div>

        <div class="space-y-3.5 max-h-[380px] overflow-y-auto pr-1" id="links-container">
            <!-- Dynamic Links populated via JavaScript -->
        </div>

        <div class="mt-6 text-center text-[10px] text-white/60">
            Powered by Affiliate Bio Creator • Cập nhật mỗi ngày ✨
        </div>
    </div>

    <!-- Modal Thông báo copy link -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900/90 text-white px-4 py-2 rounded-xl text-xs shadow-xl opacity-0 transition-opacity pointer-events-none z-50">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-msg">Đã sao chép liên kết vào bộ nhớ tạm!</span>
        </div>
    </div>

    <!-- Modal Cấu hình / Thêm Link -->
    <div id="config-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white text-slate-800 w-full max-w-sm rounded-2xl p-6 shadow-2xl relative animate-in fade-in zoom-in duration-200">
            <h3 class="text-lg font-bold mb-4 text-indigo-600 flex items-center justify-between">
                <span>Quản lý & Thêm Link Mới</span>
                <button type="button" onclick="closeConfigModal()" class="text-slate-400 hover:text-slate-600 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </h3>

            <form id="add-link-form" onsubmit="addNewLink(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Tiêu đề sản phẩm/deal:</label>
                    <input type="text" id="new-title" required placeholder="Ví dụ: Bộ nồi inox cao cấp gia đình" class="w-full px-3 py-2 text-xs border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Đường dẫn Affiliate URL:</label>
                    <input type="url" id="new-url" required placeholder="https://shope.ee/..." class="w-full px-3 py-2 text-xs border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Danh mục:</label>
                    <select id="new-category" class="w-full px-3 py-2 text-xs border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                        <option value="cosmetics">💄 Mỹ phẩm</option>
                        <option value="tech">💻 Công nghệ</option>
                        <option value="home" selected>🏠 Gia dụng</option>
                        <option value="fashion">👗 Thời trang</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nhãn nổi bật (Badge - tùy chọn):</label>
                    <input type="text" id="new-badge" placeholder="Ví dụ: 🔥 Hot Deal, ⚡ Giảm 50%" class="w-full px-3 py-2 text-xs border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Link Ảnh minh họa (URL):</label>
                    <input type="url" id="new-image" placeholder="https://images.unsplash.com/..." class="w-full px-3 py-2 text-xs border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs rounded-lg transition shadow-md">
                    + Thêm Link Vào Bio
                </button>
            </form>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'affiliateLinksGiaDung';

        function getDefaultLinks() {
            return [
                {
                    id: 1,
                    title: "Bếp từ điện đa năng cho căn bếp hiện đại",
                    url: "https://shopee.vn",
                    category: "home",
                    badge: "🔥 Hot Deal -40%",
                    image: "https://images.unsplash.com/photo-1556911220-bff31c812dba?auto=format&fit=crop&w=150&q=80",
                    clicks: 342
                },
                {
                    id: 2,
                    title: "Máy lọc không khí siêu êm, hiệu quả cao",
                    url: "https://lazada.vn",
                    category: "home",
                    badge: "⚡ Săn sale đêm nay",
                    image: "https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=150&q=80",
                    clicks: 521
                },
                {
                    id: 3,
                    title: "Nồi chiên không dầu thông minh dung tích lớn",
                    url: "https://shopee.vn",
                    category: "home",
                    badge: "🎁 Tặng kèm quà",
                    image: "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&w=150&q=80",
                    clicks: 189
                },
                {
                    id: 4,
                    title: "Máy xay sinh tố mini tiện dụng cho gia đình",
                    url: "https://tiktok.com",
                    category: "home",
                    badge: "✨ New Arrival",
                    image: "https://images.unsplash.com/photo-1571175443880-49e1d25b2bc5?auto=format&fit=crop&w=150&q=80",
                    clicks: 275
                },
                {
                    id: 5,
                    title: "Serum Vitamin C sáng da mờ thâm hiệu quả",
                    url: "https://shopee.vn",
                    category: "cosmetics",
                    badge: "⭐ Best Seller",
                    image: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=150&q=80",
                    clicks: 412
                }
            ];
        }

        function loadAffiliateLinks() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return getDefaultLinks();

            try {
                const parsed = JSON.parse(saved);
                return Array.isArray(parsed) && parsed.length ? parsed : getDefaultLinks();
            } catch (error) {
                console.warn('Lỗi đọc dữ liệu link bio, dùng dữ liệu mặc định:', error);
                return getDefaultLinks();
            }
        }

        function saveAffiliateLinks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(affiliateLinks));
        }

        let affiliateLinks = loadAffiliateLinks();
        let currentFilter = 'all';

        // Render danh sách link
        function renderLinks(filter = 'all') {
            const container = document.getElementById('links-container');
            container.innerHTML = '';

            const filtered = filter === 'all'
                ? affiliateLinks
                : affiliateLinks.filter(item => item.category === filter);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-white/70 text-xs">Chưa có sản phẩm nào trong danh mục này.</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = `link-card bg-white/15 hover:bg-white/25 border border-white/20 rounded-2xl p-3 flex items-center justify-between gap-3 cursor-pointer`;
                card.onclick = () => handleLinkClick(item.url, item.id);

                card.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0">
                        <img src="${item.image}" alt="Product" class="w-12 h-12 rounded-xl object-cover shrink-0 bg-white/20" onerror="this.src='https://placehold.co/100x100/ffffff/4f46e5?text=Deal'" />
                        <div class="min-w-0 text-left">
                            ${item.badge ? `<span class="inline-block bg-rose-500/80 text-white text-[10px] font-semibold px-2 py-0.5 rounded-full mb-1">${item.badge}</span>` : ''}
                            <h3 class="font-semibold text-xs text-white truncate">${item.title}</h3>
                            <p class="text-[10px] text-white/70 mt-0.5"><i class="fa-solid fa-fire text-amber-300 mr-1"></i>${item.clicks} lượt click</p>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center shrink-0 hover:bg-white text-indigo-600 transition">
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Lọc theo danh mục
        function filterLinks(category, event) {
            currentFilter = category;

            document.querySelectorAll('.category-btn').forEach(btn => {
                const isActive = btn.dataset.category === category;
                btn.classList.toggle('bg-white', isActive);
                btn.classList.toggle('text-indigo-700', isActive);
                btn.classList.toggle('active', isActive);
                btn.classList.toggle('bg-white/20', !isActive);
                btn.classList.toggle('text-white', !isActive);
            });

            renderLinks(category);
        }

        // Xử lý khi bấm vào link affiliate
        function handleLinkClick(url, id) {
            const found = affiliateLinks.find(i => i.id === id);
            if (found) {
                found.clicks += 1;
                saveAffiliateLinks();
            }
            renderLinks(currentFilter);

            showToast("Đang chuyển hướng đến trang mua hàng chính hãng...");
            setTimeout(() => {
                window.open(url, '_blank', 'noopener,noreferrer');
            }, 600);
        }

        // Chia sẻ trang Bio
        function shareLink() {
            const currentUrl = window.location.href;
            navigator.clipboard.writeText(currentUrl)
                .then(() => showToast("Đã sao chép liên kết trang Bio của bạn!"))
                .catch(() => {
                    const dummy = document.createElement('input');
                    document.body.appendChild(dummy);
                    dummy.value = currentUrl;
                    document.execCommand('copy');
                    document.body.removeChild(dummy);
                    showToast("Đã sao chép liên kết trang Bio của bạn!");
                });
        }

        // Hiển thị thông báo Toast tùy chỉnh
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }

        // Modal quản lý
        function openConfigModal() {
            document.getElementById('config-modal').classList.remove('hidden');
            document.getElementById('config-modal').classList.add('flex');
        }

        function closeConfigModal() {
            document.getElementById('config-modal').classList.add('hidden');
            document.getElementById('config-modal').classList.remove('flex');
        }

        // Thêm link mới
        function addNewLink(e) {
            e.preventDefault();
            const title = document.getElementById('new-title').value.trim();
            const url = document.getElementById('new-url').value.trim();
            const category = document.getElementById('new-category').value;
            const badge = document.getElementById('new-badge').value.trim();
            const image = document.getElementById('new-image').value.trim() || 'https://placehold.co/100x100/ffffff/4f46e5?text=Deal';

            if (!title || !url) {
                showToast('Vui lòng nhập tiêu đề và link hợp lệ!');
                return;
            }

            const newItem = {
                id: Date.now(),
                title,
                url,
                category,
                badge,
                image,
                clicks: 1
            };

            affiliateLinks.unshift(newItem);
            saveAffiliateLinks();
            renderLinks(currentFilter);
            closeConfigModal();
            document.getElementById('add-link-form').reset();
            showToast("Đã thêm sản phẩm affiliate mới thành công!");
        }

        // Khởi chạy lần đầu khi tải trang
        window.onload = function() {
            renderLinks('all');
            filterLinks('all');
        }
    </script>
</body>
</html>
